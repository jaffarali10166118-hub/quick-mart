<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickMart</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  background:#f5f5f5;
  transition:0.3s;
}

/* DARK MODE */
body.dark{
  background:#121212;
  color:#eee;
}

body.dark header{background:#000;}
body.dark .card{background:#1e1e1e;color:white;}
body.dark .cart{background:#1e1e1e;color:white;}
body.dark .categories button{background:#333;color:white;}
body.dark .categories .active{background:white;color:black;}

/* HEADER */
header{
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}

/* THEME BUTTON */
.theme-btn{
  position:fixed;
  top:15px;
  right:15px;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* CATEGORY */
.categories{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:15px;
}

.categories button{
  padding:10px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

.categories .active{
  background:black;
  color:white;
}

/* PRODUCTS */
.products{
const products = [
{
  name:"Earphones",
  price:499,
  cat:"mobile",
  images:[
    "https://images.unsplash.com/photo-1518441902110-2c64c62b7c1b?w=500",
    "https://images.unsplash.com/photo-1585386959984-a4155224f4c3?w=500",
    "https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=500"
  ]
},
{
  name:"Charger",
  price:799,
  cat:"mobile",
  images:[
    "https://images.unsplash.com/photo-1580910051074-3eb694886505?w=500",
    "https://images.unsplash.com/photo-1609592806787-3d9a5e68a4c4?w=500"
  ]
},
{
  name:"T-Shirt",
  price:599,
  cat:"clothing",
  images:[
    "https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=500",
    "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=500"
  ]
},
{
  name:"Jeans",
  price:1299,
  cat:"clothing",
  images:[
    "https://images.unsplash.com/photo-1542272604-787c3835534d?w=500",
    "https://images.unsplash.com/photo-1582552938357-32b906df40cb?w=500"
  ]
}
];


/* IMAGE */
.main-img{
  width:100%;
  border-radius:10px;
}

.thumb{
  width:50px;
  margin:5px;
  cursor:pointer;
  border-radius:5px;
}

.thumb:hover{
  border:2px solid black;
}

/* BUTTON */
button{
  background:#28a745;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
}

/* CART BUTTON */
.cart-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:black;
  color:white;
  padding:15px;
  border-radius:50%;
  cursor:pointer;
}

.count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  border-radius:50%;
  padding:3px 6px;
}

/* CART */
.cart{
  position:fixed;
  right:-300px;
  top:0;
  width:280px;
  height:100%;
  background:white;
  padding:15px;
  transition:0.3s;
  box-shadow:-2px 0 10px rgba(0,0,0,0.3);
}

.cart.active{right:0;}

/* POPUP */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
  transition:0.3s;
}

.popup.active{
  transform:translate(-50%,-50%) scale(1);
}

/* CHECK ANIMATION */
.check{
  font-size:40px;
  color:green;
  animation:pop 0.5s;
}

@keyframes pop{
  from{transform:scale(0);}
  to{transform:scale(1);}
}
</style>
</head>

<body>

<header>
<h1>QuickMart</h1>
<p>Fast Deals, Smart Shopping</p>
</header>

<button class="theme-btn" onclick="toggleTheme()">🌙</button>

<div class="categories">
<button onclick="filter('all')" class="active">All</button>
<button onclick="filter('mobile')">Mobile Accessories</button>
<button onclick="filter('clothing')">Clothing</button>
</div>

<div class="products" id="products"></div>

<div class="cart-btn" onclick="toggleCart()">
🛒 <span class="count" id="count">0</span>
</div>

<div class="cart" id="cart">
<h3>Cart</h3>
<ul id="cartItems"></ul>
<h4>Total ₹<span id="total">0</span></h4>
<p>UPI: yourname@upi</p>
<button onclick="checkout()">Order</button>
</div>

<div class="popup" id="popup">
<div class="check">✔</div>
<h2>Order Confirmed</h2>
<button onclick="closePopup()">OK</button>
</div>

<script>

/* PRODUCTS */
const products=[
{
 name:"Earphones",
 price:499,
 cat:"mobile",
 images:[
  "https://via.placeholder.com/200",
  "https://via.placeholder.com/200/0000FF",
  "https://via.placeholder.com/200/FF0000"
 ]
},
{
 name:"T-Shirt",
 price:599,
 cat:"clothing",
 images:[
  "https://via.placeholder.com/200",
  "https://via.placeholder.com/200/00FF00",
  "https://via.placeholder.com/200/000000"
 ]
}
];

let cart=[];

/* LOAD */
function loadProducts(cat="all"){
 let html="";
 products.forEach((p,i)=>{
  if(cat==="all"||p.cat===cat){
   html+=`
   <div class="card">
    <img id="main-${i}" class="main-img" src="${p.images[0]}">
    <div>
      ${p.images.map(img=>`
        <img src="${img}" class="thumb" onclick="change(${i},'${img}')">
      `).join("")}
    </div>
    <h3>${p.name}</h3>
    <p>₹${p.price}</p>
    <button onclick="add(${i})">Add to Cart</button>
   </div>`;
  }
 });
 document.getElementById("products").innerHTML=html;
}

/* IMAGE SWITCH */
function change(i,img){
 document.getElementById("main-"+i).src=img;
}

/* FILTER */
function filter(cat){
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 event.target.classList.add("active");
 loadProducts(cat);
}

/* CART */
function add(i){
 cart.push(products[i]);
 update();
 document.getElementById("count").innerText=cart.length;
}

function update(){
 let list="",total=0;
 cart.forEach(item=>{
  list+=`<li>${item.name} - ₹${item.price}</li>`;
  total+=item.price;
 });
 document.getElementById("cartItems").innerHTML=list;
 document.getElementById("total").innerText=total;
}

function toggleCart(){
 document.getElementById("cart").classList.toggle("active");
}

/* ORDER */
function checkout(){
 if(cart.length===0){alert("Cart empty");return;}

 document.getElementById("popup").classList.add("active");

 let phone="919XXXXXXXXX";
 let msg="Order:%0A";
 cart.forEach(i=>{
  msg+=`${i.name} - ₹${i.price}%0A`;
 });

 setTimeout(()=>{
  window.open(`https://wa.me/${phone}?text=${msg}`);
 },1200);
}

function closePopup(){
 document.getElementById("popup").classList.remove("active");
}

/* DARK MODE */
function toggleTheme(){
 document.body.classList.toggle("dark");
 localStorage.setItem("theme",document.body.classList.contains("dark")?"dark":"light");
}

if(localStorage.getItem("theme")==="dark"){
 document.body.classList.add("dark");
}

loadProducts();

</script>

</body>
</html>
