<!DOCTYPE html>
<html>
<head>
<title>QuickMart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {font-family:Arial; margin:0; background:#f2f2f2; transition:0.3s;}
header {background:#111;color:white;text-align:center;padding:20px;}
.topbar {display:flex;justify-content:space-between;padding:10px;}
.search {padding:8px;width:70%;border-radius:20px;border:none;}
.category button {
    padding:8px 15px;margin:5px;border:none;border-radius:20px;
    background:#2ecc71;color:white;
}
.products {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:15px;padding:20px;
}
.card {
    background:white;padding:10px;border-radius:10px;text-align:center;
    position:relative;
}
.card img {width:100%;height:120px;object-fit:cover;}

.star {
    position:absolute;
    top:5px;
    right:5px;
    font-size:18px;
    cursor:pointer;
}

.cart {
    position:fixed;bottom:20px;right:20px;
    background:black;color:white;padding:15px;border-radius:50%;
}

.popup {
    display:none;position:fixed;top:40%;left:50%;
    transform:translate(-50%,-50%);
    background:#2ecc71;color:white;padding:20px;border-radius:10px;
}

.dark {background:#121212;color:white;}
.dark .card {background:#1e1e1e;}

footer {background:#111;color:white;text-align:center;padding:10px;}
</style>
</head>

<body>

<header>
<h1>QuickMart</h1>
<p>Delivery in 24 Hours 🚀</p>
</header>

<div class="topbar">
<input class="search" placeholder="Search..." onkeyup="search()">
<button onclick="darkMode()">🌙</button>
</div>

<div class="category">
<button onclick="filter('all')">All</button>
<button onclick="filter('electronics')">Electronics</button>
<button onclick="filter('garments')">Garments</button>
<button onclick="filter('kids')">Kids</button>
</div>

<div class="products" id="products">

<!-- ELECTRONICS -->
<script>
for(let i=1;i<=20;i++){
document.write(`
<div class="card electronics">
<span class="star" onclick="toggleStar(this)">⭐</span>
<img src="https://via.placeholder.com/150">
<h4>Mobile Accessory ${i}</h4>
<p>₹${100+i*20}</p>
<p>Free Delivery</p>
<button onclick="buy()">Buy</button>
</div>
`);
}
</script>

<!-- GARMENTS MALE -->
<script>
let male=["Shirt","T-Shirt","Jeans","Jacket","Hoodie","Kurta","Sweater","Blazer","Track Pant","Shorts"];
male.forEach((item,i)=>{
document.write(`
<div class="card garments">
<span class="star" onclick="toggleStar(this)">⭐</span>
<img src="https://via.placeholder.com/150">
<h4>Men ${item}</h4>
<p>₹${500+i*100} | Size: M,L,XL</p>
<button onclick="buy()">Buy</button>
</div>
`);
});
</script>

<!-- GARMENTS FEMALE -->
<script>
let female=["Dress","Top","Saree","Kurti","Skirt","Jeans","Gown","Suit","Tunic","Jacket"];
female.forEach((item,i)=>{
document.write(`
<div class="card garments">
<span class="star" onclick="toggleStar(this)">⭐</span>
<img src="https://via.placeholder.com/150">
<h4>Women ${item}</h4>
<p>₹${600+i*120} | Size: S,M,L</p>
<button onclick="buy()">Buy</button>
</div>
`);
});
</script>

<!-- KIDS -->
<script>
for(let i=1;i<=30;i++){
document.write(`
<div class="card kids">
<span class="star" onclick="toggleStar(this)">⭐</span>
<img src="https://via.placeholder.com/150">
<h4>Kids Product ${i}</h4>
<p>₹${200+i*15}</p>
<button onclick="buy()">Buy</button>
</div>
`);
}
</script>

</div>

<div class="cart">🛒</div>

<div class="popup" id="popup">✅ Order Confirmed (UPI)</div>

<footer>
<p>Free Delivery | 24 Hour Service</p>
<p>Founded by Mr Jaffar Ali</p>
</footer>

<script>
let wishlist = [];

function darkMode(){
document.body.classList.toggle("dark");
}

function buy(){
popup.style.display="block";
setTimeout(()=>popup.style.display="none",2000);
}

function toggleStar(el){
let card = el.parentElement;
let name = card.querySelector("h4").innerText;

if(wishlist.includes(name)){
wishlist = wishlist.filter(item => item !== name);
el.innerHTML = "⭐";
el.style.color = "black";
}else{
wishlist.push(name);
el.innerHTML = "❤️";
el.style.color = "red";
}

sortWishlist();
}

function sortWishlist(){
let container = document.getElementById("products");
let cards = Array.from(container.children);

cards.sort((a,b)=>{
let aName = a.querySelector("h4").innerText;
let bName = b.querySelector("h4").innerText;

return (wishlist.includes(bName) - wishlist.includes(aName));
});

cards.forEach(card => container.appendChild(card));
}

function filter(cat){
let items=document.getElementsByClassName("card");
for(let i=0;i<items.length;i++){
items[i].style.display=(cat=="all"||items[i].classList.contains(cat))?"block":"none";
}
}

function search(){
let input=document.querySelector(".search").value.toLowerCase();
let items=document.querySelectorAll(".card");
items.forEach(el=>{
el.style.display=el.innerText.toLowerCase().includes(input)?"block":"none";
});
}
</script>

</body>
</html>
